<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Stats preview card component</title>

  <link rel="stylesheet" href="style.css">

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
    <section class="card">

      <aside class="imgholder">
        <figure class="imgcontainer">
          <img class="mobile_img" src="./images/image-header-mobile.jpg" alt="">
          <img class="desktop_img" src="./images/image-header-desktop.jpg" alt="">
        </figure>
      </aside>
      
      <aside class="textbox | flexcol">
        <section class="textcontainer | flexcol">
          <h1 class="herotitle">Get <span>insights</span> that help your 
            bussiness grow.</h1>
            <p>Discover the benefits of data analytics and make  
              better decisions regarding revenue, customer 
              experience, and overall efficiency.
            </p>
          </section>
          
          <div class="statscontainer">
            <p><span>10k+</span>COMPANIES</p>
            <p><span>314</span>TEMPLATE</p>
            <p><span>12M+</span>QUERIES</p>
          </div>
        </aside>
      </section>
  </main>

  <footer>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a target="_blank" href="https://www.frontendmentor.io/profile/murali0309">murali0309</a>.
    </div>
  </footer>
</body>
</html>
